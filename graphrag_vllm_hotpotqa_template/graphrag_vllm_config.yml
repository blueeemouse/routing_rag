# ============================================
# GraphRAG vLLM 配置模板
# ============================================
# 使用说明:
# 1. 启动 vLLM 服务:
#    vllm serve Qwen/Qwen2.5-3B-Instruct --port 8000
#    
#    如需同时启用 embedding，可使用支持 embedding 的模型:
#    vllm serve BAAI/bge-small-en-v1.5 --port 8000
#
# 2. 复制此配置文件到你的 GraphRAG 工作目录
#
# 3. 修改以下参数:
#    - cache.base_dir: 缓存目录路径
#    - input.base_dir: 输入数据目录路径
#    - output.base_dir: 输出目录路径
#    - reporting.base_dir: 日志目录路径
#    - root_dir: 工作根目录路径
#    - models.default_chat_model.model: 你加载的模型名
#    - models.default_embedding_model.model: 你的 embedding 模型名
# ============================================

cache:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_vllm_hotpotqa_template\cache
  type: file

chunks:
  group_by_columns:
  - id
  overlap: 50
  size: 300

cluster_graph:
  max_cluster_size: 10
  use_lcc: true

community_reports:
  max_input_length: 2000
  max_length: 500
  model_id: default_chat_model

embed_graph:
  dimensions: 768
  enabled: false
  num_walks: 10
  walk_length: 40

embeddings:
  batch_max_tokens: 8191
  batch_size: 16
  model: BAAI/bge-small-en-v1.5  # vLLM embedding 模型
  model_id: default_embedding_model

extract_graph:
  entity_types:
  - person
  - organization
  - event
  - location
  - gpe
  max_gleanings: 1
  model: default_chat_model
  prompt: null

global_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model

input:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_vllm_hotpotqa_template\input
  encoding: utf-8
  file_type: text
  text_column: text
  type: file

local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model

models:
  # ===== vLLM 本地配置 =====
  # Chat 模型配置
  default_chat_model:
    api_base: http://127.0.0.1:8000/v1  # vLLM 默认端点
    api_key: EMPTY  # vLLM 通常不需要 API key，填任意值即可
    concurrent_requests: 25
    max_tokens: 4096
    model: Qwen/Qwen2.5-3B-Instruct  # vLLM 加载的模型名（HuggingFace 格式）
    model_provider: openai  # 使用 OpenAI 兼容协议
    request_timeout: 600.0
    temperature: 0
    type: chat
  
  # Embedding 模型配置
  # 注意：vLLM 需要启动时支持 embedding 功能
  # 启动命令示例: vllm serve BAAI/bge-small-en-v1.5 --port 8001
  default_embedding_model:
    api_base: http://127.0.0.1:8001/v1  # 可单独部署 embedding 模型
    api_key: EMPTY
    concurrent_requests: 25
    model: BAAI/bge-small-en-v1.5  # vLLM embedding 模型名
    model_provider: openai  # 使用 OpenAI 兼容协议
    request_timeout: 600.0
    type: embedding

output:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_vllm_hotpotqa_template\output
  type: file

prune_graph:
  min_edge_weight_pct: 40.0
  min_node_degree: 1

reporting:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_vllm_hotpotqa_template\logs
  type: file

root_dir: D:\Develop\all_RAG\routing_rag\graphrag_vllm_hotpotqa_template

snapshots:
  embeddings: false
  graphml: false
  raw_graph: false

summarize_descriptions:
  max_input_tokens: 1000
  max_length: 200
  model_id: default_chat_model
