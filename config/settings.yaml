# ============================================
# Decomposer 配置
# ============================================
# 选项 1: 使用 API 服务（当前注释）
# decomposer:
#   api_url: "${API_BASE_URL}"
#   api_key: "${DECOMPOSER_API_KEY}"
#   model: "gpt-5.1"
#   prompt: "将复杂查询分解为简单子查询。输入：{query}\n输出子查询，每行一个：（如果判断不需要分解，则返回原查询）"

# 选项 2: 使用本地 Ollama（当前启用）
decomposer:
  api_url: "${API_BASE_URL}"  # 基础 URL，代码中会自动添加 /chat/completions
  api_key: "${DECOMPOSER_API_KEY}"
  model: "qwen2.5:3b"
  temperature: 0.0
  prompt: |
    任务：将复杂查询分解为简单子查询

    规则：
    1. 如果查询很简单，直接返回原查询
    2. 如果查询复杂，分解为多个子查询
    3. 每行一个子查询
    4. 不要包含任何解释、分析或说明文字
    5. 只输出子查询内容

    示例：
    输入：什么是人工智能？它有哪些应用？
    输出：
    什么是人工智能？
    人工智能有哪些应用？

    输入：北京是中国的首都吗？
    输出：
    北京是中国的首都吗？

    输入：1+1等于几？
    输出：
    1+1等于几？

    现在请处理以下查询：
    输入：{query}
    输出：

# ============================================
# Router 配置
# ============================================
# 选项 1: 使用 API 服务（当前注释）
# router:
#   api_url: "${API_BASE_URL}/chat/completions"
#   api_key: "${ROUTER_API_KEY}"
#   model: "deepseek-v3"
#   prompt: "确定查询处理策略：no_rag, naive_rag, 或 graph_rag。查询：{sub_query}\n策略："

# 选项 2: 使用本地 Ollama（当前启用）
router:
  api_url: "${API_BASE_URL}"  # 基础 URL，代码中会自动添加 /chat/completions
  api_key: "${ROUTER_API_KEY}"
  model: "qwen2.5:3b"
  temperature: 0.0
  prompt: |
    任务：确定查询处理策略

    可选策略：
    - no_rag: 直接回答，无需检索
    - naive_rag: 使用向量检索
    - graph_rag: 使用图检索

    规则：
    1. 简单事实性问题 → no_rag
    2. 需要信息检索的问题 → naive_rag
    3. 复杂关系查询 → graph_rag
    4. 只输出策略名称，不要任何解释

    示例：
    查询：1+1等于几？
    策略：no_rag

    查询：北京是中国的首都吗？
    策略：no_rag

    查询：什么是人工智能？
    策略：naive_rag

    查询：张三和李四的关系是什么？
    策略：graph_rag

    现在请处理以下查询：
    查询：{sub_query}
    策略：

# ============================================
# NoRAG 配置
# ============================================
# 选项 1: 使用 API 服务（当前注释）
# no_rag:
#   api_url: "${API_BASE_URL}/chat/completions"
#   api_key: "${NAIVE_RAG_API_KEY}"
#   model: "gpt-4o"
#   temperature: 0.0
#   prompt_template: |
#     You are a precise question-answering assistant. Your task is to answer the given question directly and concisely.
#     ...

# 选项 2: 使用本地 Ollama（当前启用）
no_rag:
  api_url: "${API_BASE_URL}/chat/completions"
  api_key: "${NO_RAG_API_KEY}"
  model: "qwen2.5:3b"
  temperature: 0.0
  prompt_template: |
    You are a precise question-answering assistant. Your task is to answer the given question directly and concisely.

    Guidelines:
    1. Provide ONLY the answer, no explanations or reasoning
    2. Keep the answer as short as possible - typically 1-5 words
    3. For yes/no questions, answer only "yes" or "no"
    4. For dates, use the exact format (e.g., "December 31, 2015")
    5. For numbers, provide just the number (e.g., "1522")
    6. For names, provide just the name (e.g., "Terry Crews")
    7. DO NOT include phrases like "The answer is", "According to", "Based on", etc.
    8. DO NOT add any additional context or information

    Question: {query}
    Answer:

# ============================================
# NaiveRAG 配置
# ============================================
# 选项 1: 使用 API 服务（当前注释）
# naive_rag:
#   api_url: "${API_BASE_URL}"
#   api_key: "${NAIVE_RAG_API_KEY}"
#   model: "gpt-4o"
#   embedding_model: "text-embedding-ada-002"
#   chunk_size: 512
#   top_k: 5
#   temperature: 0.0

# 选项 2: 使用本地 Ollama（当前启用）
naive_rag:
  api_url: "http://127.0.0.1:11434"  # Ollama 不需要 /v1 后缀
  api_key: "ollama"  # Ollama 通常使用 "ollama" 作为 API key
  model: "qwen2.5:3b"
  embedding_model: "nomic-embed-text"
  chunk_size: 512
  top_k: 5
  temperature: 0.0
  prompt_template: |
    Context information is below.
    ---------------------
    {context_str}
    ---------------------
    Given the context information and not prior knowledge, answer the query.

    Guidelines:
    1. Provide ONLY the answer, no explanations or reasoning
    2. Keep the answer as short as possible - typically 1-5 words
    3. For yes/no questions, answer only "yes" or "no"
    4. For dates, use the exact format (e.g., "December 31, 2015")
    5. For numbers, provide just the number (e.g., "1522")
    6. For names, provide just the name (e.g., "Terry Crews")
    7. DO NOT include phrases like "The answer is", "According to", "Based on", etc.
    8. DO NOT add any additional context or information
    9. If the answer is not in the context, say "I don't know"

    Query: {query_str}
    Answer:

graph_rag:
  api_url: "${API_BASE_URL}/chat/completions"
  api_key: "${GRAPHRAG_API_KEY}"
  model: "gpt-4o"
  embedding_model: "text-embedding-ada-002"
  chunk_size: 512
  top_k: 5
  temperature: 0.0
  prompt_template: |
    Context information is below.
    ---------------------
    {context_str}
    ---------------------
    Given the context information and not prior knowledge, answer the query.

    Guidelines:
    1. Provide ONLY the answer, no explanations or reasoning
    2. Keep the answer as short as possible - typically 1-5 words
    3. For yes/no questions, answer only "yes" or "no"
    4. For dates, use the exact format (e.g., "December 31, 2015")
    5. For numbers, provide just the number (e.g., "1522")
    6. For names, provide just the name (e.g., "Terry Crews")
    7. DO NOT include phrases like "The answer is", "According to", "Based on", etc.
    8. DO NOT add any additional context or information
    9. If the answer is not in the context, say "I don't know"

    Query: {query_str}
    Answer:

rag:
  naive_rag_enabled: true
  graph_rag_enabled: true