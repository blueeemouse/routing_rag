# ============================================
# LLM 后端选择说明
# ============================================
# 本项目支持以下 LLM 后端，可通过修改配置在它们之间切换：
#
# 1. Ollama (默认)
#    - 端点: http://127.0.0.1:11434
#    - 模型名: qwen2.5:3b, llama3:8b 等
#    - 特点: 简单易用，适合本地开发
#
# 2. vLLM
#    - 端点: http://127.0.0.1:8000/v1
#    - 模型名: Qwen/Qwen2.5-3B-Instruct 等 (HuggingFace 格式)
#    - 特点: 高性能推理，支持连续批处理
#    - 启动命令: python -m vllm.entrypoints.openai.api_server --model Qwen/Qwen2.5-3B-Instruct --port 8000
#
# 3. OpenAI API / 其他兼容服务
#    - 端点: 由服务提供商指定
#    - 模型名: gpt-4o, gpt-3.5-turbo 等
#    - 特点: 云端服务，需要 API Key
#
# 切换方式：修改各组件的 api_url 和 model 参数即可
# ============================================

# ============================================
# Ollama vs vLLM 切换指南
# ============================================
#
# 【关键差异】
#
# 1. 模型名称格式不同：
#    - Ollama: "qwen2.5:3b" (模型名:标签)
#    - vLLM:   "Qwen/Qwen2.5-3B-Instruct" (HuggingFace格式)
#
# 2. API URL 格式不同（重要！）：
#    - Ollama: API_BASE_URL="http://127.0.0.1:11434"  (不带/v1)
#    - vLLM:   API_BASE_URL="http://127.0.0.1:8000/v1" (必须带/v1)
#
#    原因：代码会自动添加路径后缀
#    - Decomposer/Router: 自动添加 /v1/chat/completions
#    - NoRAG: 自动添加 /chat/completions (不处理/v1)
#    - 所以 vLLM 的 API_BASE_URL 必须带 /v1 后缀
#
# 【环境变量设置】
#
# Ollama 环境：
#   export API_BASE_URL="http://127.0.0.1:11434"
#   export DECOMPOSER_API_KEY="ollama"
#   export ROUTER_API_KEY="ollama"
#   export NO_RAG_API_KEY="ollama"
#
# vLLM 环境：
#   export API_BASE_URL="http://127.0.0.1:8000/v1"
#   export DECOMPOSER_API_KEY="EMPTY"
#   export ROUTER_API_KEY="EMPTY"
#   export NO_RAG_API_KEY="EMPTY"
#
# 【切换步骤】
#
# 切换到 Ollama：
#   1. 设置环境变量（见上）
#   2. 将下方各组件的 model 改为 "qwen2.5:3b"
#
# 切换到 vLLM：
#   1. 启动 vLLM 服务
#   2. 设置环境变量（见上）
#   3. 将下方各组件的 model 改为 "Qwen/Qwen2.5-3B-Instruct"
#
# ============================================

# ============================================
# Decomposer 配置
# ============================================
# 选项 1: 使用 API 服务（当前注释）
# decomposer:
#   api_url: "${API_BASE_URL}"
#   api_key: "${DECOMPOSER_API_KEY}"
#   model: "gpt-5.1"
#   prompt: "将复杂查询分解为简单子查询。输入：{query}\n输出子查询，每行一个：（如果判断不需要分解，则返回原查询）"

# 选项 2: 使用本地 Ollama（当前启用）
decomposer:
  api_url: "${API_BASE_URL}"  # 基础 URL，代码中会自动添加 /chat/completions
  api_key: "${DECOMPOSER_API_KEY}"
  # model: "qwen2.5:3b"  # Ollama 模型名
  model: "Qwen/Qwen2.5-3B-Instruct"  # vLLM 模型名 (HuggingFace格式)
  temperature: 0.0
  prompt: |
    任务：将复杂查询分解为简单子查询

    规则：
    1. 如果查询很简单，直接返回原查询
    2. 如果查询复杂，分解为多个子查询
    3. 每行一个子查询
    4. 不要包含任何解释、分析或说明文字
    5. 只输出子查询内容

    示例：
    输入：什么是人工智能？它有哪些应用？
    输出：
    什么是人工智能？
    人工智能有哪些应用？

    输入：北京是中国的首都吗？
    输出：
    北京是中国的首都吗？

    输入：1+1等于几？
    输出：
    1+1等于几？

    现在请处理以下查询：
    输入：{query}
    输出：

# ============================================
# Router 配置
# ============================================
# 选项 1: 使用 API 服务（当前注释）
# router:
#   api_url: "${API_BASE_URL}/chat/completions"
#   api_key: "${ROUTER_API_KEY}"
#   model: "deepseek-v3"
#   prompt: "确定查询处理策略：no_rag, naive_rag, 或 graph_rag。查询：{sub_query}\n策略："

# 选项 2: 使用本地 Ollama（当前启用）
router:
  api_url: "${API_BASE_URL}"  # 基础 URL，代码中会自动添加 /chat/completions
  api_key: "${ROUTER_API_KEY}"
  # model: "qwen2.5:3b"  # Ollama 模型名
  model: "Qwen/Qwen2.5-3B-Instruct"  # vLLM 模型名 (HuggingFace格式)
  temperature: 0.0
  prompt: |
    任务：确定查询处理策略

    可选策略：
    - no_rag: 直接回答，无需检索
    - naive_rag: 使用向量检索
    - graph_rag: 使用图检索

    规则：
    1. 简单事实性问题 → no_rag
    2. 需要信息检索的问题 → naive_rag
    3. 复杂关系查询 → graph_rag
    4. 只输出策略名称，不要任何解释

    示例：
    查询：1+1等于几？
    策略：no_rag

    查询：北京是中国的首都吗？
    策略：no_rag

    查询：什么是人工智能？
    策略：naive_rag

    查询：张三和李四的关系是什么？
    策略：graph_rag

    现在请处理以下查询：
    查询：{sub_query}
    策略：

# ============================================
# NoRAG 配置
# ============================================
# 选项 1: 使用 API 服务（当前注释）
# no_rag:
#   api_url: "${API_BASE_URL}/chat/completions"
#   api_key: "${NAIVE_RAG_API_KEY}"
#   model: "gpt-4o"
#   temperature: 0.0
#   prompt_template: |
#     You are a precise question-answering assistant. Your task is to answer the given question directly and concisely.
#     ...

# 选项 2: 使用本地 Ollama（当前启用）
no_rag:
  # vLLM配置: 使用 /v1 后缀，代码会自动添加 /chat/completions
  # Ollama配置: 使用 http://127.0.0.1:11434 (不需要/v1)
  # api_url: "${API_BASE_URL}"  # vLLM: http://127.0.0.1:8000/v1
  api_url: "http://127.0.0.1:8000/v1"
  # api_key: "${NO_RAG_API_KEY}"
  api_key: "EMPTY"
  # model: "qwen2.5:3b"  # Ollama 模型名
  model: "Qwen/Qwen2.5-3B-Instruct"  # vLLM 模型名 (HuggingFace格式)
  temperature: 0.0
  prompt_template: |
    You are a precise question-answering assistant. Your task is to answer the given question directly and concisely.

    Guidelines:
    1. Provide ONLY the answer, no explanations or reasoning
    2. Keep the answer as short as possible - typically 1-5 words
    3. For yes/no questions, answer only "yes" or "no"
    4. For dates, use the exact format (e.g., "December 31, 2015")
    5. For numbers, provide just the number (e.g., "1522")
    6. For names, provide just the name (e.g., "Terry Crews")
    7. DO NOT include phrases like "The answer is", "According to", "Based on", etc.
    8. DO NOT add any additional context or information

    Question: {query}
    Answer:

# ============================================
# NaiveRAG 配置
# ============================================
# 选项 1: 使用 API 服务（当前注释）
# naive_rag:
#   api_url: "${API_BASE_URL}"
#   api_key: "${NAIVE_RAG_API_KEY}"
#   model: "gpt-4o"
#   embedding_model: "text-embedding-ada-002"
#   chunk_size: 512
#   top_k: 5
#   temperature: 0.0

# 选项 2: 使用本地 Ollama（当前启用）
# naive_rag:
#   api_url: "http://127.0.0.1:11434"  # Ollama 不需要 /v1 后缀
#   api_key: "ollama"  # Ollama 通常使用 "ollama" 作为 API key
#   model: "qwen2.5:3b"
#   embedding_model: "nomic-embed-text"  # Ollama embedding 模型
#   chunk_size: 512
#   top_k: 5
#   temperature: 0.0

# 选项 3: 使用本地 vLLM（示例配置）
# naive_rag:
#   api_url: "http://127.0.0.1:8000/v1"  # vLLM LLM 端点
#   api_key: "EMPTY"  # vLLM 通常不需要 API key，填任意值即可
#   model: "Qwen/Qwen2.5-3B-Instruct"  # vLLM 加载的模型名（HuggingFace 格式）
#   embedding_model: "nomic-ai/nomic-embed-text-v1"  # vLLM embedding 模型（HuggingFace 格式）
#   embedding_url: "http://127.0.0.1:8001"  # vLLM embedding 端点（独立部署）
#   embedding_provider: "vllm"  # 指定使用 vLLM embedding
#   chunk_size: 512
#   top_k: 5
#   temperature: 0.0

# 当前启用配置 (Ollama)
naive_rag:
  api_url: "http://127.0.0.1:11434"  # Ollama 不需要 /v1 后缀
  api_key: "ollama"  # Ollama 通常使用 "ollama" 作为 API key
  model: "qwen2.5:3b"  # Ollama 模型名
  embedding_model: "nomic-embed-text"
  embedding_provider: "auto"  # 可选值: ollama, openai, vllm, auto（自动检测）

  #####################################
  api_url: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"  # vLLM 通常不需要 API key，填任意值即可
  model: "Qwen/Qwen2.5-3B-Instruct"  # vLLM 模型名 (HuggingFace格式)
  embedding_model: "nomic-ai/nomic-embed-text-v1"  # vLLM embedding 模型（HuggingFace 格式）
  embedding_url: "http://127.0.0.1:8001"  # vLLM embedding 端点（独立部署）
  embedding_provider: "vllm"  # 指定使用 vLLM embedding
  #####################################
  chunk_size: 512
  top_k: 5
  temperature: 0.0
  prompt_template: |
    Context information is below.
    ---------------------
    {context_str}
    ---------------------
    Given the context information and not prior knowledge, answer the query.

    Guidelines:
    1. Provide ONLY the answer, no explanations or reasoning
    2. Keep the answer as short as possible - typically 1-5 words
    3. For yes/no questions, answer only "yes" or "no"
    4. For dates, use the exact format (e.g., "December 31, 2015")
    5. For numbers, provide just the number (e.g., "1522")
    6. For names, provide just the name (e.g., "Terry Crews")
    7. DO NOT include phrases like "The answer is", "According to", "Based on", etc.
    8. DO NOT add any additional context or information
    9. If the answer is not in the context, say "I don't know"

    Query: {query_str}
    Answer:

# ============================================
# GraphRAG 配置
# ============================================
# 注意：GraphRAG 使用独立的 .yml 配置文件（如 graphrag_hotpotqa_config.yml）
# settings.yaml 中的配置仅作为参考，实际查询时使用独立配置文件中的值
#
# 后端切换方式（修改 graphrag_xxx_config.yml）：
#
# Ollama 配置:
#   models:
#     default_chat_model:
#       api_base: http://127.0.0.1:11434/v1
#       api_key: ollama
#       model: qwen2.5:3b
#       model_provider: openai
#
# vLLM 配置:
#   models:
#     default_chat_model:
#       api_base: http://127.0.0.1:8000/v1
#       api_key: EMPTY
#       model: Qwen/Qwen2.5-3B-Instruct
#       model_provider: openai  # 使用 OpenAI 兼容协议
#
# OpenAI API 配置:
#   models:
#     default_chat_model:
#       api_base: ${API_BASE_URL}
#       api_key: ${GRAPHRAG_API_KEY}
#       model: gpt-4o
#       model_provider: openai

# 选项 1: 使用 API 服务（当前注释）
# graph_rag:
