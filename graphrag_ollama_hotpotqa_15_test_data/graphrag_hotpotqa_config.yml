cache:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_ollama_hotpotqa_15_test_data\cache
  type: file
chunks:
  group_by_columns:
  - id
  overlap: 50
  size: 300
cluster_graph:
  max_cluster_size: 10
  use_lcc: true
community_reports:
  max_input_length: 2000
  max_length: 500
  model_id: default_chat_model
embed_graph:
  # dimensions: 1536
  dimensions: 768
  enabled: false
  num_walks: 10
  walk_length: 40
embeddings:
  batch_max_tokens: 8191
  batch_size: 16
  # model: text-embedding-ada-002、
  model: nomic-embed-text
  model_id: default_embedding_model
extract_graph:
  entity_types:
  - person
  - organization
  - event
  - location
  - gpe
  max_gleanings: 1
  model: default_chat_model
  prompt: null
global_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
input:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_ollama_hotpotqa_15_test_data\input
  encoding: utf-8
  file_type: text
  text_column: text
  type: file
local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
models:
  # ===== OpenAI 云端配置（已注释） =====
  # default_chat_model:
  #   api_base: https://api.openai.com/v1
