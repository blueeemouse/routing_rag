# DCRouter训练配置示例

# 模型类型: dc, knn, mf, rl
model_type: "dc"

# 模型配置
model:
  # Backbone模型名称
  # 可选: 
  #   - sentence-transformers/all-MiniLM-L6-v2 (推荐，轻量)
  #   - sentence-transformers/all-mpnet-base-v2
  #   - microsoft/mdeberta-v3-base
  #   - DeepPavlov/bert-base-neck-ru-qe
  backbone_name: "sentence-transformers/all-MiniLM-L6-v2"
  
  # 隐藏层大小 (自动从backbone获取)
  hidden_size: 384
  
  # 策略名称列表 (对应RAG实现)
  strategy_names: ["no_rag", "naive_rag", "graph_rag"]
  
  # 策略数量
  num_strategies: 3
  
  # 相似度计算方式: "cos" (余弦相似度) or "dot" (内积)
  similarity_function: "cos"
  
  # 温度参数
  temperature: 1.0
  
  # 设备
  device: "auto"  # auto, cpu, cuda

# 训练配置
training:
  # 批量大小
  batch_size: 32
  
  # 学习率
  learning_rate: 5.0e-5
  
  # 训练轮数
  epochs: 10
  
  # 最大序列长度
  max_length: 512
  
  # 训练步数 (0表示使用epochs)
  training_steps: 0
  
  # 评估步数
  eval_steps: 100
  
  # 保存步数
  save_steps: 500
  
  # 损失权重
  sample_llm_loss_weight: 1.0
  sample_sample_loss_weight: 0.1
  cluster_loss_weight: 1.0
  
  # Top-K / Last-K (对比学习参数)
  top_k: 3
  last_k: 3
  
  # 优化器类型
  optimizer_type: "adamw"
  
  # 学习率调度器类型
  scheduler_type: "linear"
  
  # 梯度裁剪
  max_grad_norm: 1.0
  
  # 混合精度训练
  use_amp: false
  
  # 随机种子
  seed: 42

# 数据配置
data:
  # 数据源类型: "hotpotqa" or "llm_judge"
  source: "hotpotqa"
  
  # 数据路径
  train_path: "evaluation_results"
  val_path: ""
  test_path: ""
  
  # Cluster数量 (用于聚类对比学习)
  num_clusters: 50
  
  # 是否归一化分数
  normalize_scores: true
  
  # 是否打乱数据
  shuffle: true

# 输出配置
output_dir: "router_models"

# 日志配置
logging_dir: "router_models/logs"
log_level: "info"
