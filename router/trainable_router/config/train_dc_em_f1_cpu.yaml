# DC Router 训练配置（CPU 测试版本）
# 用于代码验证和调试，避免 CUDA 显存占用

# ============================================================================
# 策略扩展说明
# ============================================================================
# 要增加新策略时，需要修改以下配置：
#
# 1. strategy_names: 添加新策略名称
# 2. num_strategies: 更新为策略总数
# 3. top_k / last_k: 根据策略数量调整（原则：top_k + last_k <= num_strategies - 1）
#
# 示例：
#   - 2 策略: top_k=1, last_k=1
#   - 3 策略: top_k=1, last_k=1 或 top_k=2, last_k=1
#   - 5 策略: top_k=2, last_k=2
#
# ============================================================================

# 模型类型
model_type: "dc"

# 模型配置
model:
  # Backbone 模型
  backbone_name: "sentence-transformers/all-MiniLM-L6-v2"
  hidden_size: 384

  # === 策略配置（扩展策略时修改这里）===
  # 当前有 2 个策略（graph_rag 数据待收集）
  strategy_names: ["no_rag", "naive_rag"]
  num_strategies: 2

  # 相似度计算
  similarity_function: "cos"
  temperature: 1.0

  # === 设备配置（CPU 测试）===
  device: "cpu"  # 使用 CPU，避免 CUDA 显存占用

# 训练配置
training:
  batch_size: 8   # 减小 batch size 以适应 CPU
  learning_rate: 5.0e-5
  epochs: 1       # 只训练 1 个 epoch 进行测试
  max_length: 512

  # === 对比学习参数 ===
  top_k: 1
  last_k: 1

  # === 损失权重配置 ===
  sample_llm_loss_weight: 1.0
  sample_sample_loss_weight: 0.0    # CPU 测试时禁用，加速训练
  cluster_loss_weight: 0.0           # CPU 测试时禁用，加速训练

  # 训练控制
  training_steps: 0
  eval_steps: 20      # 更频繁的评估
  save_steps: 50      # 更频繁的保存

  # 优化器配置
  optimizer_type: "adamw"
  optimizer_kwargs: {}

  # 学习率调度器配置
  scheduler_type: "linear"

  # 梯度裁剪
  max_grad_norm: 1.0

  # 混合精度训练（CPU 不支持）
  use_amp: false

  # 随机种子
  seed: 42

# 数据配置
data:
  source: "hotpotqa"

  # === 数据路径配置 ===
  train_path: "HotpotQA_train_data"  # 训练数据目录
  val_path: ""
  test_path: ""

  # === Cluster 配置 ===
  num_clusters: 50

  # 数据预处理
  normalize_scores: true
  shuffle: true

  # === 评分公式配置 ===
  score_formula: "em * 0.3 + f1 * 0.7"

# 输出配置
output_dir: "router_models/train_dc_em_f1_cpu_test"
logging_dir: "router_models/train_dc_em_f1_cpu_test/logs"
log_level: "info"

# ============================================================================
# CPU 测试说明
# ============================================================================
#
# 此配置用于代码验证和调试，避免 CUDA 显存占用
#
# 关键调整：
# 1. device: "cpu" - 使用 CPU 而非 CUDA
# 2. batch_size: 8 - 减小 batch size 适应 CPU
# 3. epochs: 1 - 只训练 1 个 epoch 快速验证
# 4. sample_sample_loss_weight: 0.0 - 禁用 sample-sample 损失（计算密集）
# 5. cluster_loss_weight: 0.0 - 禁用 cluster 损失（计算密集）
# 6. eval_steps: 20, save_steps: 50 - 更频繁的评估和保存
#
# 使用方法：
#   python router/train_router.py --config router/trainable_router/config/train_dc_em_f1_cpu.yaml
#
# 预期效果：
#   - 验证代码能否正常工作
#   - 检查数据加载、模型初始化、训练循环是否正常
#   - 完成后可以切换到 CUDA 配置进行完整训练
#
# ============================================================================
