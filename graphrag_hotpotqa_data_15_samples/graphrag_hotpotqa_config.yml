cache:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_hotpotqa_data_15_samples\cache
  type: file
chunks:
  group_by_columns:
  - id
  overlap: 50
  size: 300
cluster_graph:
  max_cluster_size: 10
  use_lcc: true
community_reports:
  max_input_length: 2000
  max_length: 500
  model_id: default_chat_model
embed_graph:
  dimensions: 1536
  enabled: true
  num_walks: 10
  walk_length: 40
embeddings:
  batch_max_tokens: 8191
  batch_size: 16
  model: text-embedding-ada-002
  model_id: default_embedding_model
extract_graph:
  entity_types:
  - person
  - organization
  - event
  - location
  - gpe
  max_gleanings: 1
  model: default_chat_model
  prompt: null
global_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
input:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_hotpotqa_data_15_samples\input
  encoding: utf-8
  file_type: text
  text_column: text
  type: file
local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: 'Context information is below.

    ---------------------

    {context_str}

    ---------------------

    Given the context information and not prior knowledge, answer the query.


    Guidelines:

    1. Provide ONLY the answer, no explanations or reasoning

    2. Keep the answer as short as possible - typically 1-5 words

    3. For yes/no questions, answer only "yes" or "no"

    4. For dates, use the exact format (e.g., "December 31, 2015")

    5. For numbers, provide just the number (e.g., "1522")

    6. For names, provide just the name (e.g., "Terry Crews")

    7. DO NOT include phrases like "The answer is", "According to", "Based on", etc.

    8. DO NOT add any additional context or information

    9. If the answer is not in the context, say "I don''t know"


    Query: {query_str}

    Answer:'
models:
  default_chat_model:
    api_base: ${API_BASE_URL}
    api_key: ${GRAPHRAG_API_KEY}
    concurrent_requests: 25
    max_tokens: 2000
    model: gpt-4o
    model_provider: openai
    request_timeout: 180.0
    temperature: 0
    type: chat
  default_embedding_model:
    api_base: ${API_BASE_URL}
    api_key: ${GRAPHRAG_API_KEY}
    concurrent_requests: 25
    model: text-embedding-ada-002
    model_provider: openai
    request_timeout: 180.0
    type: embedding
output:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_hotpotqa_data_15_samples\output
  type: file
prune_graph:
  min_edge_weight_pct: 40.0
  min_node_degree: 1
reporting:
  base_dir: D:\Develop\all_RAG\routing_rag\graphrag_hotpotqa_data_15_samples\logs
  type: file
root_dir: D:\Develop\all_RAG\routing_rag\graphrag_hotpotqa_data_15_samples
snapshots:
  embeddings: false
  graphml: false
  raw_graph: false
summarize_descriptions:
  max_input_tokens: 1000
  max_length: 200
  model_id: default_chat_model
